[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moconut"
version = "0.1.0.dev0"
dependencies = ['torch>=2.0']
authors = [
    { name = "Danzel Serrano", email = "danzel.serrano@gmail.com" }
]
description = "Pure Data-style patching for PyTorch models, with NEAT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/dependanz/moconut"

[tool.setuptools.packages.find]
include = ["moconut*"]